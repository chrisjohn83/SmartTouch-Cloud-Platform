name: Build and Deploy

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install mkdocs==1.6.1
          pip install mkdocs-material==9.6.14
          pip install pymdown-extensions==10.16.1
          npm install -g markdownlint-cli
          cargo install lychee
          npm ci --include=dev

      - name: Markdown Lint Validation
        continue-on-error: true
        run: |
          markdownlint docs/**/*.md README.md --config .markdownlint.json

      - name: Vale Spell Check
        continue-on-error: true
        uses: errata-ai/vale-action@reviewdog
        with:
          files: docs/
      
      - name: Lint OpenAPI specs
        run: npm run lint:openapi

      - name: Build MkDocs Site
        run: |
          mkdocs build --strict

      - name: Broken Link Validation
        continue-on-error: true
        run: |
          lychee site/**/*.html
  
  openapi-breaking-changes:
    name: OpenAPI Breaking Change Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5

      - name: Resolve v1 contract location on base branch
        id: contract-base
        shell: bash
        run: |
          root="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.base_ref }}/docs/openapi"
          if curl --fail --silent --head "$root/v1/device-api.yaml" > /dev/null; then
            echo "root=$root/v1" >> "$GITHUB_OUTPUT"
          else
            echo "root=$root" >> "$GITHUB_OUTPUT"
          fi

      - name: Check audit log API breaking changes
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: ${{ steps.contract-base.outputs.root }}/audit-log-api.yaml
          revision: docs/openapi/v1/audit-log-api.yaml

      - name: Check deployment API breaking changes
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: ${{ steps.contract-base.outputs.root }}/deployment-api.yaml
          revision: docs/openapi/v1/deployment-api.yaml

      - name: Check device API breaking changes
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: ${{ steps.contract-base.outputs.root }}/device-api.yaml
          revision: docs/openapi/v1/device-api.yaml

      - name: Check remote access API breaking changes
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: ${{ steps.contract-base.outputs.root }}/remote-access-api.yaml
          revision: docs/openapi/v1/remote-access-api.yaml

      - name: Check session API breaking changes
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: ${{ steps.contract-base.outputs.root }}/session-api.yaml
          revision: docs/openapi/v1/session-api.yaml

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
        
      - name: Install MkDocs
        run: |
          pip install mkdocs==1.6.1
          pip install mkdocs-material==9.6.14
          pip install pymdown-extensions==10.16.1

      - name: Deploy Documentation
        run: |
          mkdocs gh-deploy --force
