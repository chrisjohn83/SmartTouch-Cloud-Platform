name: Build and Deploy

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install mkdocs==1.6.1
          pip install mkdocs-material==9.6.14
          pip install pymdown-extensions==10.16.1
          npm install -g markdownlint-cli
          cargo install lychee

      - name: Markdown Lint Validation
        continue-on-error: true
        run: |
          markdownlint docs/**/*.md README.md --config .markdownlint.json

      - name: Vale Spell Check
        continue-on-error: true
        uses: errata-ai/vale-action@reviewdog
        with:
          files: docs/

      - name: Build MkDocs Site
        run: |
          mkdocs build --strict

      - name: Broken Link Validation
        continue-on-error: true
        run: |
          lychee site/**/*.html

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: |
          pip install mkdocs==1.6.1
          pip install mkdocs-material==9.6.14
          pip install pymdown-extensions==10.16.1

      - name: Deploy Documentation
        run: |
          mkdocs gh-deploy --force