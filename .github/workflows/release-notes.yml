name: Release notes draft

on:
  workflow_dispatch:
    inputs:
      since: { description: "Start date (YYYY-MM-DD)", required: true }
      until: { description: "End date (YYYY-MM-DD)", required: true }
      version: { description: "Release version", required: true }

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Unit tests and accuracy gate
        run: |
          python -m pytest -q
          python -m relnotes eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Generate and validate release notes
        run: |
          python -m relnotes generate \
            --since "${{ inputs.since }}" \
            --until "${{ inputs.until }}" \
            --version "${{ inputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          BITBUCKET_ACCESS_TOKEN: ${{ secrets.BITBUCKET_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Upload draft + quality report (always, so failures can be reviewed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: out/
