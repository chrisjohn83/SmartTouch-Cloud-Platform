name: OpenAPI Conformance

on:
  pull_request:
    paths:
      - "docs/openapi/**"
      - "redocly.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/openapi-conformance.yml"

jobs:
  lint-openapi:
    name: Lint OpenAPI specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint OpenAPI specs
        run: npm run lint:openapi
