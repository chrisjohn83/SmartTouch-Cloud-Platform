<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartTouch Audit Log API v2 Playground</title>
  <style>body { margin: 0; }</style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  <script src="../javascripts/scalar-playground.js"></script>
  <script>
    SmartTouchPlayground.create(
      '#app',
      '/SmartTouch-Cloud-Platform/assets/openapi/audit-log-api-v2.yaml',
      {
        theme: 'purple',
        hideTestRequestButton: false,
        hideClientButton: false,
        modelsSectionLabel: 'Schemas',
        defaultHttpClient: { targetKey: 'shell', clientKey: 'curl' },
        agent: { disabled: true }
      }
    );
  </script>
</body>
</html>
