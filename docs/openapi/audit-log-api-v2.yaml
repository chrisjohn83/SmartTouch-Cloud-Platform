openapi: 3.1.0
info:
  title: SmartTouch Audit Log API v2
  description: Query immutable SmartTouch device and deployment audit events.
  license:
    name: Proprietary
    url: https://docs.smarttouch.io/legal/license
  version: 2.0.0
paths:
  /v2/audit/events:
    get:
      tags:
      - Audit Log API v2
      summary: List audit events
      operationId: list_audit_events_v2_audit_events_get
      security:
      - HTTPBearer: []
      parameters:
      - name: event
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Event
      - name: actor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
      - name: resource_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Type
      - name: resource_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
      - name: outcome
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(success|failure)$
          - type: 'null'
          title: Outcome
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Since
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Until
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/audit/events/{entry_id}:
    get:
      tags:
      - Audit Log API v2
      summary: Get an audit event
      operationId: get_audit_event_v2_audit_events__entry_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          title: Entry Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AuditEvent:
      properties:
        id:
          type: string
          title: Id
        event:
          type: string
          title: Event
        actor:
          type: string
          title: Actor
        resource_type:
          type: string
          title: Resource Type
        resource_id:
          type: string
          title: Resource Id
        outcome:
          type: string
          title: Outcome
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        request_id:
          type: string
          title: Request Id
        details:
          additionalProperties: true
          type: object
          title: Details
      type: object
      required:
      - id
      - event
      - actor
      - resource_type
      - resource_id
      - outcome
      - timestamp
      - request_id
      title: AuditEvent
    AuditEventListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AuditEvent'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/CursorMeta'
      type: object
      required:
      - data
      - meta
      title: AuditEventListResponse
    AuditEventResponse:
      properties:
        data:
          $ref: '#/components/schemas/AuditEvent'
      type: object
      required:
      - data
      title: AuditEventResponse
    CursorMeta:
      properties:
        limit:
          type: integer
          title: Limit
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - limit
      title: CursorMeta
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
servers:
- url: http://127.0.0.1:8090
  description: Local reference service
- url: https://api.smarttouch.io
  description: Production placeholder
