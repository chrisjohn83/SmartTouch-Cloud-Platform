openapi: 3.1.0
info:
  title: SmartTouch Device API v2
  description: Register, list, inspect, update, and deregister SmartTouch devices.
  license:
    name: Proprietary
    url: https://docs.smarttouch.io/legal/license
  version: 2.0.0
paths:
  /v2/devices:
    get:
      tags:
      - Device API v2
      summary: List devices
      operationId: list_devices_v2_devices_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AgentStatus'
          - type: 'null'
          title: Status
      - name: fleet
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Fleet
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Device API v2
      summary: Register a device
      operationId: register_device_v2_devices_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/devices/{device_id}:
    get:
      tags:
      - Device API v2
      summary: Get a device
      operationId: get_device_v2_devices__device_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Device API v2
      summary: Update device metadata
      operationId: update_device_v2_devices__device_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Device API v2
      summary: Deregister a device
      operationId: deregister_device_v2_devices__device_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/devices/{device_id}/agent-status:
    get:
      tags:
      - Device API v2
      summary: Get device agent status
      operationId: get_agent_status_v2_devices__device_id__agent_status_get
      security:
      - HTTPBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AgentStatus:
      type: string
      enum:
      - online
      - offline
      - unknown
      title: AgentStatus
    AgentStatusDetail:
      properties:
        device_id:
          type: string
          title: Device Id
        agent_status:
          $ref: '#/components/schemas/AgentStatus'
        last_seen_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen At
        broker_url:
          type: string
          title: Broker Url
        latency_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Latency Ms
        checked_at:
          type: string
          format: date-time
          title: Checked At
      type: object
      required:
      - device_id
      - agent_status
      - broker_url
      - checked_at
      title: AgentStatusDetail
    AgentStatusResponse:
      properties:
        data:
          $ref: '#/components/schemas/AgentStatusDetail'
      type: object
      required:
      - data
      title: AgentStatusResponse
    CursorMeta:
      properties:
        limit:
          type: integer
          title: Limit
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - limit
      title: CursorMeta
    Device:
      properties:
        id:
          type: string
          title: Id
        display_name:
          type: string
          title: Display Name
        fleet:
          anyOf:
          - type: string
          - type: 'null'
          title: Fleet
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
        agent_status:
          $ref: '#/components/schemas/AgentStatus'
        agent_version:
          type: string
          title: Agent Version
        last_seen_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen At
        remote_access:
          $ref: '#/components/schemas/RemoteAccessConfig'
      type: object
      required:
      - id
      - display_name
      - agent_status
      - agent_version
      - remote_access
      title: Device
    DeviceCreate:
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{2,63}$
          title: Id
          examples:
          - sensor-003
        display_name:
          type: string
          maxLength: 120
          minLength: 1
          title: Display Name
        fleet:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Fleet
        agent_version:
          type: string
          maxLength: 40
          title: Agent Version
          default: 2.0.0
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
      additionalProperties: false
      type: object
      required:
      - id
      - display_name
      title: DeviceCreate
    DeviceListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Device'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/CursorMeta'
      type: object
      required:
      - data
      - meta
      title: DeviceListResponse
    DeviceResponse:
      properties:
        data:
          $ref: '#/components/schemas/Device'
      type: object
      required:
      - data
      title: DeviceResponse
    DeviceUpdate:
      properties:
        display_name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Display Name
        fleet:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Fleet
        labels:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Labels
      additionalProperties: false
      type: object
      title: DeviceUpdate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RemoteAccessConfig:
      properties:
        enabled:
          type: boolean
          title: Enabled
        broker_url:
          type: string
          title: Broker Url
        allowed_protocols:
          items:
            type: string
          type: array
          title: Allowed Protocols
      type: object
      required:
      - enabled
      - broker_url
      - allowed_protocols
      title: RemoteAccessConfig
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
servers:
- url: http://127.0.0.1:8090
  description: Local reference service
- url: https://api.smarttouch.io
  description: Production placeholder
