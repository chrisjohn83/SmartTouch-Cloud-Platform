site_name: SmartTouch Cloud Platform
site_url: https://chrisjohn83.github.io/SmartTouch-Cloud-Platform

plugins:
  - search

exclude_docs: |
  developers/observability/**
  developers/deploy-release/**
  developers/troubleshooting/**
  developers/platform-engineering/**
  developers/get-started/set-up-local-development/**
  developers/onboarding/**
  developers/get-started/connect-first-device/**
  developers/get-started/deploy-first-iot-service/**
  developers/secrets-config/**

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes

  palette:
    - scheme: default
      primary: blue
      accent: cyan

    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

nav:
  - Home: index.md
  - Getting Started:
      - Test Device API:
          - Overview: developers/get-started/windows-device-api/index.md
          - Register Device: developers/get-started/windows-device-api/01-register-device.md
          - Inspect Device: developers/get-started/windows-device-api/02-inspect-device.md
          - Verify Agent Status: developers/get-started/windows-device-api/03-verify-agent-status.md
      - Test Deployment API:
          - Overview: developers/get-started/windows-deployment-api/index.md
          - Prepare Request: developers/get-started/windows-deployment-api/01-prepare-service-request.md
          - Submit Deployment: developers/get-started/windows-deployment-api/02-submit-deployment.md
          - Verify Deployment: developers/get-started/windows-deployment-api/03-verify-deployment.md
      - Set Up Local Development:
          - Overview: developers/get-started/windows-local-development/index.md
          - Set Up Windows API Tools: developers/get-started/windows-local-development/01-set-up-api-tools.md
          - Optional Kubernetes: developers/get-started/windows-local-development/02-optional-kubernetes.md
          - Run Portal and API: developers/get-started/windows-local-development/03-run-portal-and-api.md
  - Developer Journey:
      - Overview: developers/windows-onboarding/index.md
      - Prerequisites: developers/windows-onboarding/prerequisites.md
      - Platform Concepts: developers/windows-onboarding/platform-concepts.md
      - Authentication: developers/windows-onboarding/authentication.md
      - First API Call: developers/windows-onboarding/first-api-call.md
      - Common Errors: developers/windows-onboarding/common-errors.md
      - Secrets Configuration:
          - Overview: developers/windows-secrets-config/index.md
          - Environment Configuration: developers/windows-secrets-config/environment-configuration.md
          - Manage Secrets: developers/windows-secrets-config/manage-secrets.md
          - Deployment Request Schema: developers/windows-secrets-config/deployment-request-schema.md
  - API Reference:
      - Overview: api-reference/index.md
      - Device API:
          - V1: api-reference/device-api.md
          - V2: api-reference/device-api-v2.md
      - Deployment API:
          - V1: api-reference/deployment-api.md
          - V2: api-reference/deployment-api-v2.md
      - Session API: api-reference/session-api.md
      - Remote Access Sessions: api-reference/remote-access-api.md
      - Audit Log API:
          - V1: api-reference/audit-log-api.md
          - V2: api-reference/audit-log-api-v2.md
  - API Playground:
      - Overview: playground/index.md
      - Device API:
          - V1: playground/device-api.md
          - V2: playground/device-api-v2.md
      - Deployment API:
          - V1: playground/deployment-api.md
          - V2: playground/deployment-api-v2.md
      - Session API: playground/session-api.md
      - Remote Access Sessions: playground/remote-access-api.md
      - Audit Log API:
          - V1: playground/audit-log-api.md
          - V2: playground/audit-log-api-v2.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/rag-ask.css
  - assets/stylesheets/api-version-selector.css
  - assets/stylesheets/api-mode.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/javascripts/rag-ask.js
  - assets/javascripts/api-version-selector.js
copyright: >
  © 2026 SmartTouch Cloud Platform |
  Documentation Prototype by Chris Johnjoseph
