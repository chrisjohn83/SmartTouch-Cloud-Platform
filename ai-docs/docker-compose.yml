services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smarttouch-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarttouch_ai}
      POSTGRES_USER: ${POSTGRES_USER:-smarttouch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - smarttouch_ai_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttouch -d smarttouch_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smarttouch_ai_data:
