openapi: 3.0.3

info:
  title: SmartTouch Audit Log API
  description: |
    Query the immutable audit log for remote access events on the SmartTouch Cloud Platform.

    Every remote access session open, close, and expiry is recorded as an audit entry.
    Entries include the user identity, device, protocol, source IP, timestamp, and a
    distributed trace ID for correlation with logs and traces.

    ## Access control
    Reading the audit log requires either the `administrator` role or the `audit:read`
    permission granted by an Administrator.

    ## Immutability
    Audit entries cannot be created, modified, or deleted through the API.
    The audit log is append-only and tamper-evident.

    ## Retention
    Entries are retained for 90 days by default. Administrators can configure longer
    retention in platform settings.

    ## Authentication
    All endpoints require a bearer token obtained via `stctl auth token`.

    ## Base URL
    ```
    https://api.<your-platform-domain>/v1
    ```

    ## Related APIs
    - [Session API](./session-api.yaml) — open and close sessions that generate audit events
    - [Device API](./device-api.yaml) — filter audit events by device
  version: "1.0.0"
  contact:
    name: SmartTouch Developer Experience
    url: https://docs.smarttouch.io
  license:
    name: Proprietary
    url: https://docs.smarttouch.io/legal/license

servers:
  - url: https://api.smarttouch.local/v1
    description: Local development environment
  - url: https://api.dev.smarttouch.io/v1
    description: Dev environment
  - url: https://api.staging.smarttouch.io/v1
    description: Staging environment
  - url: https://api.smarttouch.io/v1 
    description: Production environment

security:
  - bearerAuth: []

tags:
  - name: Audit Log
    description: Query remote access audit events (read-only)

paths:

  /audit/remote-access:
    get:
      operationId: listAuditEntries
      summary: List audit log entries
      description: |
        Returns audit log entries for remote access events in reverse chronological order
        (most recent first).

        Use query parameters to narrow results by device, user, event type, or time range.
        All filter parameters are optional and combinable.

        **Rate limit:** 60 requests per minute.
      tags: [Audit Log]
      parameters:
        - name: device_id
          in: query
          required: false
          description: Filter by device ID
          schema:
            type: string
            example: sensor-001
        - name: user
          in: query
          required: false
          description: Filter by user email address
          schema:
            type: string
            format: email
            example: alice@example.com
        - name: event
          in: query
          required: false
          description: Filter by event type
          schema:
            type: string
            enum:
              - session.opened
              - session.closed
              - session.expired
        - name: protocol
          in: query
          required: false
          description: Filter by session protocol
          schema:
            type: string
            enum: [shell, diagnostics, file-transfer]
        - name: since
          in: query
          required: false
          description: Return entries with timestamps after this ISO 8601 value (inclusive)
          schema:
            type: string
            format: date-time
            example: "2026-06-08T00:00:00Z"
        - name: until
          in: query
          required: false
          description: Return entries with timestamps before this ISO 8601 value (exclusive)
          schema:
            type: string
            format: date-time
            example: "2026-06-09T00:00:00Z"
        - name: session_id
          in: query
          required: false
          description: Filter by session ID to retrieve all events for a single session
          schema:
            type: string
            example: sess-9c4d2e
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: List of audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryListResponse'
              examples:
                session_lifecycle:
                  summary: Full session lifecycle for sensor-001
                  value:
                    status: 200
                    data:
                      - id: audit-002
                        event: session.closed
                        session_id: sess-9c4d2e
                        device_id: sensor-001
                        protocol: diagnostics
                        user: alice@example.com
                        source_ip: "10.0.1.42"
                        timestamp: "2026-06-08T09:18:44Z"
                        trace_id: xyz789abc012
                      - id: audit-001
                        event: session.opened
                        session_id: sess-9c4d2e
                        device_id: sensor-001
                        protocol: diagnostics
                        user: alice@example.com
                        source_ip: "10.0.1.42"
                        timestamp: "2026-06-08T09:05:00Z"
                        trace_id: xyz789abc012
                    meta:
                      page: 1
                      per_page: 100
                      total: 2
                expired_session:
                  summary: Expired session event
                  value:
                    status: 200
                    data:
                      - id: audit-003
                        event: session.expired
                        session_id: sess-8b1e4c
                        device_id: sensor-002
                        protocol: shell
                        user: bob@example.com
                        source_ip: "10.0.1.55"
                        timestamp: "2026-06-08T11:00:00Z"
                        trace_id: def456ghi789
                    meta:
                      page: 1
                      per_page: 100
                      total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /audit/remote-access/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        description: Unique audit log entry ID
        schema:
          type: string
          example: audit-001

    get:
      operationId: getAuditEntry
      summary: Get an audit log entry
      description: Returns a single audit log entry by its ID.
      tags: [Audit Log]
      responses:
        '200':
          description: Audit log entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryResponse'
              example:
                status: 200
                data:
                  id: audit-001
                  event: session.opened
                  session_id: sess-9c4d2e
                  device_id: sensor-001
                  protocol: diagnostics
                  user: alice@example.com
                  source_ip: "10.0.1.42"
                  timestamp: "2026-06-08T09:05:00Z"
                  trace_id: xyz789abc012
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Obtain a token with `stctl auth token`.
        Requires `administrator` role or `audit:read` permission.

  schemas:

    AuditEntry:
      type: object
      required: [id, event, session_id, device_id, protocol, user, timestamp]
      properties:
        id:
          type: string
          description: Unique audit entry identifier
          example: audit-001
        event:
          type: string
          enum:
            - session.opened
            - session.closed
            - session.expired
          description: |
            The audit event type:
            - `session.opened` — a session was successfully opened
            - `session.closed` — a session was explicitly closed by a user or the API
            - `session.expired` — a session closed automatically because its TTL elapsed
        session_id:
          type: string
          description: ID of the session this event relates to
          example: sess-9c4d2e
        device_id:
          type: string
          description: ID of the device the session was connected to
          example: sensor-001
        protocol:
          type: string
          enum: [shell, diagnostics, file-transfer]
          description: Session protocol used
        user:
          type: string
          description: Email address of the user who opened the session
          example: alice@example.com
        source_ip:
          type: string
          description: IP address of the client that opened the session
          example: "10.0.1.42"
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the event
          example: "2026-06-08T09:05:00Z"
        trace_id:
          type: string
          description: Distributed trace ID. Use with Jaeger or Grafana to correlate logs and spans.
          example: xyz789abc012

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 100
        total:
          type: integer
          description: Total number of matching entries
          example: 42

    AuditEntryListResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
          description: Entries in reverse chronological order (most recent first)
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    AuditEntryResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          $ref: '#/components/schemas/AuditEntry'

    Error:
      type: object
      required: [error, message, status]
      properties:
        error:
          type: string
          example: forbidden
        message:
          type: string
          example: "Reading the audit log requires the administrator role or the audit:read permission."
        status:
          type: integer
          example: 403

  responses:

    Unauthorized:
      description: Token is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: Bearer token is missing or has expired.
            status: 401

    Forbidden:
      description: Insufficient permissions — administrator role or audit:read permission required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
            message: "Reading the audit log requires the administrator role or the audit:read permission."
            status: 403

    NotFound:
      description: Audit entry not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Audit entry not found.
            status: 404

    RateLimited:
      description: Rate limit exceeded — 60 requests per minute
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limited
            message: Too many requests. Retry after 15 seconds.
            status: 429

    InternalError:
      description: Internal platform error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: 'An internal error occurred. Request ID: req-abc123.'
            status: 500
