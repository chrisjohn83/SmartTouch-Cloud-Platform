openapi: 3.0.3

info:
  title: SmartTouch Session API
  description: |
    Manage remote access sessions to IoT devices on the SmartTouch Cloud Platform.

    A session is an authenticated tunnel opened through the Remote Access Service
    between a client (developer, platform engineer, administrator, or automation)
    and a device's Remote Access Agent.

    ## Session lifecycle
    ```
    POST /remote-access/sessions  →  session.opened  (audit event)
         ↓ (session active)
    DELETE /remote-access/sessions/{id}  →  session.closed  (audit event)
    ```
    Sessions also close automatically when their TTL expires, producing a
    `session.expired` audit event.

    ## Protocol permissions

    | Protocol       | Minimum role       | Description                          |
    |----------------|--------------------|--------------------------------------|
    | `diagnostics`  | developer          | Read-only diagnostic commands        |
    | `shell`        | platform-engineer  | Full interactive shell on the device |
    | `file-transfer`| administrator      | Upload and download files            |

    ## Authentication
    All endpoints require a bearer token obtained via `stctl auth token`.

    ## Base URL
    ```
    https://api.<your-platform-domain>/v1
    ```

    ## Related APIs
    - [Device API](./device-api.yaml) — verify agent status before opening a session
    - [Audit Log API](./audit-log-api.yaml) — query session open and close events
    - [Remote Access API](./remote-access-api.yaml) — broker health and configuration
  version: "1.0.0"
  contact:
    name: SmartTouch Developer Experience
    url: https://docs.smarttouch.io
  license:
    name: Proprietary
    url: https://docs.smarttouch.io/legal/license

servers:
  - url: https://api.smarttouch.local/v1
    description: Local development environment
  - url: https://api.dev.smarttouch.io/v1
    description: Dev environment
  - url: https://api.staging.smarttouch.io/v1
    description: Staging environment
  - url: https://api.smarttouch.io/v1 
    description: Production environment

security:
  - bearerAuth: []

tags:
  - name: Sessions
    description: Remote access session lifecycle — open, inspect, list, and close sessions

paths:

  /remote-access/sessions:
    get:
      operationId: listSessions
      summary: List sessions
      description: |
        Returns remote access sessions. Developers see only their own sessions.
        Administrators see sessions for all users.
      tags: [Sessions]
      parameters:
        - name: device_id
          in: query
          required: false
          description: Filter sessions by device ID
          schema:
            type: string
            example: sensor-001
        - name: protocol
          in: query
          required: false
          description: Filter sessions by protocol
          schema:
            type: string
            enum: [shell, diagnostics, file-transfer]
        - name: status
          in: query
          required: false
          description: Filter sessions by status
          schema:
            type: string
            enum: [open, closed]
        - name: since
          in: query
          required: false
          description: Return sessions opened after this ISO 8601 timestamp
          schema:
            type: string
            format: date-time
            example: "2026-06-08T00:00:00Z"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
              example:
                status: 200
                data:
                  - id: sess-7f3a1b
                    device_id: sensor-001
                    protocol: diagnostics
                    status: open
                    user: alice@example.com
                    opened_at: "2026-06-08T09:00:00Z"
                    expires_at: "2026-06-08T10:00:00Z"
                    closed_at: null
                    trace_id: abc123def456
                meta:
                  page: 1
                  per_page: 50
                  total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: openSession
      summary: Open a session
      description: |
        Opens a new remote access session to a device.

        The device's Remote Access Agent must be online. Verify agent status with
        `GET /devices/{deviceId}/agent-status` before calling this endpoint.

        Only one session per protocol per device can be open at a time. If a session
        of the requested protocol is already open, the endpoint returns `409 Conflict`.

        On success, the response includes a `websocket_url`. Use this URL to connect
        a WebSocket client for interactive sessions. `stctl remote-access open` handles
        this automatically.
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSessionRequest'
            examples:
              diagnostics:
                summary: Open a diagnostics session (developer role)
                value:
                  device_id: sensor-001
                  protocol: diagnostics
                  ttl_seconds: 1800
              shell:
                summary: Open a shell session (platform-engineer role)
                value:
                  device_id: sensor-001
                  protocol: shell
                  ttl_seconds: 3600
              file_transfer:
                summary: Open a file-transfer session (administrator role)
                value:
                  device_id: sensor-001
                  protocol: file-transfer
                  ttl_seconds: 900
      responses:
        '201':
          description: Session opened successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                status: 201
                data:
                  id: sess-9c4d2e
                  device_id: sensor-001
                  protocol: diagnostics
                  status: open
                  user: alice@example.com
                  opened_at: "2026-06-08T09:05:00Z"
                  expires_at: "2026-06-08T09:35:00Z"
                  closed_at: null
                  websocket_url: "wss://broker.smarttouch.local:8443/sessions/sess-9c4d2e"
                  trace_id: xyz789abc012
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_found
                message: Device not found.
                status: 404
        '409':
          description: A session of this protocol is already open for this device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: conflict
                message: A diagnostics session is already open for device sensor-001.
                status: 409
        '422':
          description: Device agent is offline — session cannot be established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unprocessable_entity
                message: Cannot open session. Device agent is offline.
                status: 422
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /remote-access/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'

    get:
      operationId: getSession
      summary: Get a session
      description: |
        Returns details for a single session, including its current status,
        byte counters, and the trace ID for log correlation.
      tags: [Sessions]
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
              example:
                status: 200
                data:
                  id: sess-9c4d2e
                  device_id: sensor-001
                  protocol: diagnostics
                  status: open
                  user: alice@example.com
                  opened_at: "2026-06-08T09:05:00Z"
                  expires_at: "2026-06-08T09:35:00Z"
                  closed_at: null
                  bytes_sent: 4096
                  bytes_received: 2048
                  trace_id: xyz789abc012
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: closeSession
      summary: Close a session
      description: |
        Closes an open session immediately. The device agent terminates the tunnel
        within 5 seconds. A `session.closed` event is written to the audit log.

        Closing an already-closed session returns `404 Not Found`.
      tags: [Sessions]
      responses:
        '200':
          description: Session closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseSessionResponse'
              example:
                status: 200
                data:
                  id: sess-9c4d2e
                  status: closed
                  closed_at: "2026-06-08T09:18:44Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Obtain a token with `stctl auth token`.
        Pass it as `Authorization: Bearer <token>`.
        Tokens expire after 8 hours.

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Unique session identifier (e.g., `sess-9c4d2e`)
      schema:
        type: string
        example: sess-9c4d2e

  schemas:

    OpenSessionRequest:
      type: object
      required: [device_id, protocol]
      properties:
        device_id:
          type: string
          description: Target device ID
          example: sensor-001
        protocol:
          type: string
          enum: [shell, diagnostics, file-transfer]
          description: |
            Session protocol. Determines the level of access granted.
            - `diagnostics` — read-only inspection (developer+)
            - `shell` — full interactive shell (platform-engineer+)
            - `file-transfer` — upload/download files (administrator only)
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 28800
          default: 3600
          description: Session time-to-live in seconds. The session closes automatically when the TTL elapses.
          example: 1800

    Session:
      type: object
      required: [id, device_id, protocol, status, user, opened_at]
      properties:
        id:
          type: string
          description: Unique session identifier
          example: sess-9c4d2e
        device_id:
          type: string
          description: Device this session is connected to
          example: sensor-001
        protocol:
          type: string
          enum: [shell, diagnostics, file-transfer]
        status:
          type: string
          enum: [open, closed]
        user:
          type: string
          description: Email of the user who opened the session
          example: alice@example.com
        opened_at:
          type: string
          format: date-time
          description: When the session was opened
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the session will expire automatically
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: When the session was closed. Null if still open.
        trace_id:
          type: string
          description: Distributed trace ID for log correlation
          example: xyz789abc012

    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            websocket_url:
              type: string
              description: WebSocket URL to connect to the session tunnel. Present only on session creation (201 response).
              example: "wss://broker.smarttouch.local:8443/sessions/sess-9c4d2e"
            bytes_sent:
              type: integer
              description: Bytes sent from client to device during this session
              example: 4096
            bytes_received:
              type: integer
              description: Bytes received from device to client during this session
              example: 2048

    CloseSessionResult:
      type: object
      properties:
        id:
          type: string
          example: sess-9c4d2e
        status:
          type: string
          enum: [closed]
        closed_at:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 50
        total:
          type: integer
          example: 1

    SessionListResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    SessionResponse:
      type: object
      properties:
        status:
          type: integer
          example: 201
        data:
          $ref: '#/components/schemas/SessionDetail'

    SessionDetailResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          $ref: '#/components/schemas/SessionDetail'

    CloseSessionResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          $ref: '#/components/schemas/CloseSessionResult'

    Error:
      type: object
      required: [error, message, status]
      properties:
        error:
          type: string
          example: conflict
        message:
          type: string
          example: A diagnostics session is already open for device sensor-001.
        status:
          type: integer
          example: 409

  responses:

    Unauthorized:
      description: Token is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: Bearer token is missing or has expired.
            status: 401

    Forbidden:
      description: Insufficient role for the requested protocol
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
            message: "Your role does not permit shell sessions. Required role: platform-engineer."
            status: 403

    NotFound:
      description: Session not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: Session not found.
            status: 404

    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: "'protocol' must be one of: shell, diagnostics, file-transfer."
            status: 400

    RateLimited:
      description: Rate limit exceeded — 30 session opens per minute
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limited
            message: Too many requests. Retry after 42 seconds.
            status: 429

    InternalError:
      description: Internal platform error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: 'An internal error occurred. Request ID: req-abc123.'
            status: 500
