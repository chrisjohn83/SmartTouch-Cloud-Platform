<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SmartTouch Deployment API Playground</title>

  <style>
    body {
      margin: 0;
    }
  </style>
</head>

<body>

  <div id="app"></div>

  <script>
    window.onload = () => {
      const script = document.createElement('script');

      script.id = 'api-reference';

      script.setAttribute(
        'data-url',
        '/SmartTouch-Cloud-Platform/assets/openapi/deployment-api.yaml'
      );

      document.body.appendChild(script);

      script.src =
        'https://cdn.jsdelivr.net/npm/@scalar/api-reference';
    };
  </script>

</body>
</html>
